name: wallet

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_owner_local}
      WALLET_APP_DB_PASSWORD: ${WALLET_APP_DB_PASSWORD:-wallet_app_local}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_owner -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, whether requested from the host or from
      # inside the compose network; containers still reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  ministack:
    image: ministackorg/ministack:1.5.26
    environment:
      AUTH: "true"
      MINISTACK_REGION: us-east-1
      WALLET_CREDENTIALS_FILE: /shared/aws/credentials
    ports:
      - "${MINISTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./deploy/ministack/ready.d:/etc/localstack/init/ready.d:ro
      - sqs-credentials:/shared/aws
    healthcheck:
      # Ready only after the provisioning script finished without failures.
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          state = json.load(urllib.request.urlopen('http://127.0.0.1:4566/_ministack/ready'));
          sys.exit(0 if state.get('failed') == 0 else 1)
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
  sqs-credentials:
