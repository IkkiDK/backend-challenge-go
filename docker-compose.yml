name: wallet

# Three independent instances of the service share PostgreSQL, Keycloak and
# MiniStack: each serves the API, consumes wager-transactions.fifo, relays
# the outbox and resolves pending references, with its own connections.
#
# Every port is published on the loopback interface only: the local defaults
# include administrator credentials that must not be reachable from the network.
x-wallet-service: &wallet-service
  image: wallet-service:local
  build: .
  restart: unless-stopped
  # Longer than SHUTDOWN_TIMEOUT, so SIGTERM drains before Docker kills.
  stop_grace_period: 40s
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    ministack:
      condition: service_healthy
  volumes:
    - sqs-credentials:/shared/aws:ro
  environment: &wallet-environment
    LOG_LEVEL: ${LOG_LEVEL:-info}
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://wallet_app:${WALLET_APP_DB_PASSWORD:-wallet_app_local}@postgres:5432/wallet?sslmode=disable
    OIDC_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/wallet
    OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
    OIDC_AUDIENCE: wallet-api
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://ministack:4566
    AWS_SHARED_CREDENTIALS_FILE: /shared/aws/credentials
    AWS_PROFILE: wallet-service

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_owner_local}
      WALLET_APP_DB_PASSWORD: ${WALLET_APP_DB_PASSWORD:-wallet_app_local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_owner -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, whether requested from the host or from
      # inside the compose network; containers still reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  ministack:
    image: ministackorg/ministack:1.5.26
    environment:
      AUTH: "true"
      MINISTACK_REGION: us-east-1
      WALLET_CREDENTIALS_FILE: /shared/aws/credentials
    ports:
      - "127.0.0.1:${MINISTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./deploy/ministack/ready.d:/etc/localstack/init/ready.d:ro
      - sqs-credentials:/shared/aws
    healthcheck:
      # Ready only after the provisioning script finished without failures.
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          state = json.load(urllib.request.urlopen('http://127.0.0.1:4566/_ministack/ready'));
          sys.exit(0 if state.get('failed') == 0 else 1)
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    image: wallet-service:local
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://wallet_owner:${POSTGRES_PASSWORD:-wallet_owner_local}@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  wallet-1:
    <<: *wallet-service
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *wallet-environment
      INSTANCE_ID: wallet-1

  wallet-2:
    <<: *wallet-service
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      <<: *wallet-environment
      INSTANCE_ID: wallet-2

  wallet-3:
    <<: *wallet-service
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      <<: *wallet-environment
      INSTANCE_ID: wallet-3

volumes:
  postgres-data:
  sqs-credentials:
